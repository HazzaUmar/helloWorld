<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hello World - Level 6</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --mouse-x: 50%;
        --mouse-y: 50%;
        --rx: 0deg;
        --ry: 0deg;

        --accent: #8b5cf6;
        --accent2: #06b6d4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;

        font-family: Inter, Arial, sans-serif;

        color: white;

        background:
          radial-gradient(
            circle at var(--mouse-x) var(--mouse-y),
            rgba(139, 92, 246, 0.18),
            transparent 25%
          ),
          #020617;

        cursor: none;
      }

      /* =====================================
           CANVAS
        ===================================== */

      #canvas {
        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        z-index: 0;
      }

      /* =====================================
           CUSTOM CURSOR
        ===================================== */

      .cursor {
        position: fixed;

        width: 12px;
        height: 12px;

        border-radius: 50%;

        background: white;

        pointer-events: none;

        z-index: 1000;

        transform: translate(-50%, -50%);

        box-shadow:
          0 0 15px rgba(255, 255, 255, 0.8),
          0 0 35px var(--accent);
      }

      .cursor-ring {
        position: fixed;

        width: 42px;
        height: 42px;

        border: 1px solid rgba(255, 255, 255, 0.5);

        border-radius: 50%;

        pointer-events: none;

        z-index: 999;

        transform: translate(-50%, -50%);

        transition:
          width 0.2s,
          height 0.2s,
          border-color 0.2s;
      }

      body.hovering .cursor-ring {
        width: 70px;
        height: 70px;

        border-color: rgba(139, 92, 246, 0.9);
      }

      /* =====================================
           TOP BAR
        ===================================== */

      .topbar {
        position: fixed;

        top: 25px;
        left: 35px;
        right: 35px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        z-index: 10;
      }

      .logo {
        font-size: 18px;
        font-weight: 800;

        letter-spacing: 3px;

        opacity: 0.85;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;

        font-size: 12px;

        color: rgba(255, 255, 255, 0.55);
      }

      .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #22c55e;

        box-shadow: 0 0 12px #22c55e;

        animation: statusPulse 1.5s infinite;
      }

      /* =====================================
           SCENE
        ===================================== */

      .scene {
        position: relative;

        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        perspective: 1600px;

        z-index: 2;
      }

      /* =====================================
           GLASS CARD
        ===================================== */

      .card {
        position: relative;

        width: min(820px, 90vw);

        min-height: 520px;

        padding: 75px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        border-radius: 42px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.11),
          rgba(255, 255, 255, 0.035)
        );

        border: 1px solid rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(35px);

        -webkit-backdrop-filter: blur(35px);

        box-shadow:
          0 50px 120px rgba(0, 0, 0, 0.6),
          inset 0 1px rgba(255, 255, 255, 0.25);

        transform: rotateX(var(--rx)) rotateY(var(--ry));

        transition: transform 0.12s ease-out;
      }

      /* =====================================
           MOVING BORDER
        ===================================== */

      .card::before {
        content: "";

        position: absolute;

        inset: -1px;

        padding: 1px;

        border-radius: inherit;

        background: linear-gradient(
          120deg,
          transparent,
          #06b6d4,
          #8b5cf6,
          #ec4899,
          #06b6d4,
          transparent
        );

        background-size: 400% 400%;

        animation: borderAnimation 7s linear infinite;

        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);

        -webkit-mask-composite: xor;

        mask-composite: exclude;

        pointer-events: none;
      }

      /* =====================================
           BADGE
        ===================================== */

      .badge {
        padding: 9px 20px;

        margin-bottom: 30px;

        border-radius: 999px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.06);

        font-size: 11px;

        letter-spacing: 4px;

        text-transform: uppercase;

        color: rgba(255, 255, 255, 0.65);

        animation: float 3s ease-in-out infinite;
      }

      /* =====================================
           TITLE
        ===================================== */

      .title {
        position: relative;

        font-size: clamp(55px, 11vw, 140px);

        line-height: 0.9;

        font-weight: 900;

        letter-spacing: -7px;

        background: linear-gradient(
          90deg,
          #22d3ee,
          #6366f1,
          #a855f7,
          #ec4899,
          #fb7185,
          #22d3ee
        );

        background-size: 600% auto;

        color: transparent;

        background-clip: text;
        -webkit-background-clip: text;

        animation:
          gradientText 8s linear infinite,
          titleFloat 4s ease-in-out infinite;

        filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5));
      }

      /* =====================================
           TEXT REVEAL
        ===================================== */

      .subtitle {
        max-width: 560px;

        margin-top: 35px;

        font-size: 17px;

        line-height: 1.8;

        color: rgba(255, 255, 255, 0.55);

        animation: reveal 1.5s ease forwards;

        animation-delay: 0.4s;

        opacity: 0;
      }

      /* =====================================
           BUTTON AREA
        ===================================== */

      .buttons {
        display: flex;

        gap: 15px;

        margin-top: 40px;
      }

      .magnetic {
        position: relative;

        padding: 15px 30px;

        border: none;

        border-radius: 999px;

        color: white;

        font-size: 15px;

        font-weight: 700;

        cursor: none;

        overflow: hidden;

        background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);

        background-size: 200% auto;

        box-shadow: 0 15px 35px rgba(139, 92, 246, 0.35);

        transition:
          transform 0.15s,
          box-shadow 0.25s;

        animation: buttonGradient 4s linear infinite;
      }

      .magnetic:hover {
        box-shadow: 0 20px 55px rgba(236, 72, 153, 0.45);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.16);

        box-shadow: none;
      }

      /* =====================================
           BUTTON SHINE
        ===================================== */

      .magnetic::before {
        content: "";

        position: absolute;

        top: 0;
        left: -120%;

        width: 80%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );

        transform: skewX(-20deg);

        transition: left 0.7s;
      }

      .magnetic:hover::before {
        left: 140%;
      }

      /* =====================================
           RIPPLE
        ===================================== */

      .ripple {
        position: absolute;

        width: 20px;
        height: 20px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.5);

        transform: scale(0);

        animation: ripple 0.7s linear;

        pointer-events: none;
      }

      /* =====================================
           FLOATING ORBS
        ===================================== */

      .orb {
        position: fixed;

        border-radius: 50%;

        filter: blur(70px);

        pointer-events: none;

        z-index: 1;

        opacity: 0.25;
      }

      .orb.one {
        width: 400px;
        height: 400px;

        background: #6366f1;

        top: -180px;
        left: -150px;

        animation: orbOne 12s ease-in-out infinite alternate;
      }

      .orb.two {
        width: 350px;
        height: 350px;

        background: #ec4899;

        right: -150px;
        bottom: -150px;

        animation: orbTwo 15s ease-in-out infinite alternate;
      }

      /* =====================================
           ANIMATIONS
        ===================================== */

      @keyframes gradientText {
        0% {
          background-position: 0% center;
        }

        100% {
          background-position: 600% center;
        }
      }

      @keyframes buttonGradient {
        0% {
          background-position: 0% center;
        }

        100% {
          background-position: 200% center;
        }
      }

      @keyframes borderAnimation {
        0% {
          background-position: 0% 50%;
        }

        100% {
          background-position: 400% 50%;
        }
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-14px);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;

          transform: translateY(25px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      @keyframes ripple {
        to {
          transform: scale(7);

          opacity: 0;
        }
      }

      @keyframes statusPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }

        50% {
          transform: scale(1.6);
          opacity: 0.5;
        }
      }

      @keyframes orbOne {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(300px, 180px) scale(1.4);
        }
      }

      @keyframes orbTwo {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(-250px, -180px) scale(1.35);
        }
      }

      /* =====================================
           MOBILE
        ===================================== */

      @media (max-width: 650px) {
        body {
          cursor: default;
        }

        .cursor,
        .cursor-ring {
          display: none;
        }

        .card {
          min-height: 450px;

          padding: 45px 25px;

          border-radius: 30px;
        }

        .title {
          letter-spacing: -4px;
        }

        .subtitle {
          font-size: 15px;
        }

        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background -->

    <canvas id="canvas"></canvas>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <!-- Cursor -->

    <div class="cursor"></div>
    <div class="cursor-ring"></div>

    <!-- Header -->

    <header class="topbar">
      <div class="logo">HW.</div>

      <div class="status">
        <span class="status-dot"></span>

        SYSTEM ONLINE
      </div>
    </header>

    <!-- Main -->

    <div class="scene">
      <main class="card">
        <div class="badge">Level 06</div>

        <h1 class="title">Hello World</h1>

        <p class="subtitle">
          Welcome to an interactive digital experience where HTML, CSS and
          JavaScript work together to create motion, depth, light and
          interaction.
        </p>

        <div class="buttons">
          <button class="magnetic" id="explore">Explore</button>

          <button class="magnetic secondary" id="change">Change World</button>
        </div>
      </main>
    </div>

    <script>
      /* ==========================================
           ELEMENTS
        ========================================== */

      const root = document.documentElement;

      const cursor = document.querySelector(".cursor");

      const cursorRing = document.querySelector(".cursor-ring");

      const card = document.querySelector(".card");

      const buttons = document.querySelectorAll(".magnetic");

      const canvas = document.querySelector("#canvas");

      const ctx = canvas.getContext("2d");

      /* ==========================================
           CURSOR
        ========================================== */

      let mouseX = innerWidth / 2;
      let mouseY = innerHeight / 2;

      let ringX = mouseX;
      let ringY = mouseY;

      document.addEventListener("mousemove", (event) => {
        mouseX = event.clientX;

        mouseY = event.clientY;

        cursor.style.left = mouseX + "px";

        cursor.style.top = mouseY + "px";

        root.style.setProperty("--mouse-x", mouseX + "px");

        root.style.setProperty("--mouse-y", mouseY + "px");
      });

      function animateCursor() {
        ringX += (mouseX - ringX) * 0.12;

        ringY += (mouseY - ringY) * 0.12;

        cursorRing.style.left = ringX + "px";

        cursorRing.style.top = ringY + "px";

        requestAnimationFrame(animateCursor);
      }

      animateCursor();

      /* ==========================================
           HOVER DETECTION
        ========================================== */

      buttons.forEach((button) => {
        button.addEventListener("mouseenter", () => {
          document.body.classList.add("hovering");
        });

        button.addEventListener("mouseleave", () => {
          document.body.classList.remove("hovering");
        });
      });

      /* ==========================================
           3D CARD
        ========================================== */

      document.addEventListener("mousemove", (event) => {
        const x = event.clientX / innerWidth - 0.5;

        const y = event.clientY / innerHeight - 0.5;

        card.style.setProperty("--rx", `${y * -15}deg`);

        card.style.setProperty("--ry", `${x * 15}deg`);
      });

      /* ==========================================
           MAGNETIC BUTTONS
        ========================================== */

      buttons.forEach((button) => {
        button.addEventListener("mousemove", (event) => {
          const rect = button.getBoundingClientRect();

          const x = event.clientX - rect.left - rect.width / 2;

          const y = event.clientY - rect.top - rect.height / 2;

          button.style.transform = `translate(
                            ${x * 0.22}px,
                            ${y * 0.22}px
                        ) scale(1.04)`;
        });

        button.addEventListener("mouseleave", () => {
          button.style.transform = "";
        });
      });

      /* ==========================================
           RIPPLE
        ========================================== */

      buttons.forEach((button) => {
        button.addEventListener("click", (event) => {
          const ripple = document.createElement("span");

          ripple.className = "ripple";

          const rect = button.getBoundingClientRect();

          const size = Math.max(rect.width, rect.height);

          ripple.style.width = size + "px";

          ripple.style.height = size + "px";

          ripple.style.left = event.clientX - rect.left - size / 2 + "px";

          ripple.style.top = event.clientY - rect.top - size / 2 + "px";

          button.appendChild(ripple);

          setTimeout(() => ripple.remove(), 700);
        });
      });

      /* ==========================================
           PARTICLE SYSTEM
        ========================================== */

      let particles = [];

      function resize() {
        canvas.width = innerWidth * devicePixelRatio;

        canvas.height = innerHeight * devicePixelRatio;

        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      resize();

      window.addEventListener("resize", resize);

      class Particle {
        constructor() {
          this.x = Math.random() * innerWidth;

          this.y = Math.random() * innerHeight;

          this.vx = (Math.random() - 0.5) * 0.35;

          this.vy = (Math.random() - 0.5) * 0.35;

          this.size = Math.random() * 1.8 + 0.5;

          this.alpha = Math.random() * 0.5 + 0.1;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > innerWidth) {
            this.vx *= -1;
          }

          if (this.y < 0 || this.y > innerHeight) {
            this.vy *= -1;
          }

          /* Mouse attraction */

          const dx = mouseX - this.x;

          const dy = mouseY - this.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 180) {
            this.x += dx * 0.0015;

            this.y += dy * 0.0015;
          }
        }

        draw() {
          ctx.beginPath();

          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

          ctx.fillStyle = `rgba(
                        148,
                        163,
                        184,
                        ${this.alpha}
                    )`;

          ctx.fill();
        }
      }

      function createParticles() {
        particles = [];

        const count = Math.min(150, Math.floor(innerWidth / 8));

        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
      }

      createParticles();

      window.addEventListener("resize", createParticles);

      /* ==========================================
           CONNECT PARTICLES
        ========================================== */

      function connectParticles() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];

            const b = particles[j];

            const dx = a.x - b.x;

            const dy = a.y - b.y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 130) {
              const alpha = (1 - distance / 130) * 0.18;

              ctx.beginPath();

              ctx.moveTo(a.x, a.y);

              ctx.lineTo(b.x, b.y);

              ctx.strokeStyle = `rgba(
                                139,
                                92,
                                246,
                                ${alpha}
                            )`;

              ctx.lineWidth = 1;

              ctx.stroke();
            }
          }
        }
      }

      /* ==========================================
           MOUSE CONNECTION
        ========================================== */

      function connectMouse() {
        particles.forEach((particle) => {
          const dx = mouseX - particle.x;

          const dy = mouseY - particle.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 170) {
            ctx.beginPath();

            ctx.moveTo(mouseX, mouseY);

            ctx.lineTo(particle.x, particle.y);

            ctx.strokeStyle = `rgba(
                                34,
                                211,
                                238,
                                ${(1 - distance / 170) * 0.3}
                            )`;

            ctx.stroke();
          }
        });
      }

      /* ==========================================
           RENDER
        ========================================== */

      function animate() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);

        particles.forEach((particle) => {
          particle.update();
          particle.draw();
        });

        connectParticles();
        connectMouse();

        requestAnimationFrame(animate);
      }

      animate();

      /* ==========================================
           CHANGE WORLD
        ========================================== */

      const changeButton = document.querySelector("#change");

      let world = false;

      changeButton.addEventListener("click", () => {
        world = !world;

        if (world) {
          root.style.setProperty("--accent", "#06b6d4");

          root.style.setProperty("--accent2", "#22c55e");

          document.querySelector(".title").textContent = "New World";
        } else {
          root.style.setProperty("--accent", "#8b5cf6");

          root.style.setProperty("--accent2", "#06b6d4");

          document.querySelector(".title").textContent = "Hello World";
        }
      });

      /* ==========================================
           SIMPLE WEB AUDIO
        ========================================== */

      let audioContext;

      function playSound() {
        if (!audioContext) {
          audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }

        const oscillator = audioContext.createOscillator();

        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value = 520;

        gain.gain.setValueAtTime(0.08, audioContext.currentTime);

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.15,
        );

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(audioContext.currentTime + 0.15);
      }

      document.querySelector("#explore").addEventListener("click", playSound);
    </script>
    <nav class="level-nav" aria-label="Level navigation">
      <a href="./Level1.html">Level1</a>
      <a href="./Level2.html">Level2</a>
      <a href="./Level3.html">Level3</a>
      <a href="./Level4.html">Level4</a>
      <a href="./Level5.html">Level5</a>
      <a href="./Level6.html" aria-current="page">Level6</a>
    </nav>
  </body>
</html>
