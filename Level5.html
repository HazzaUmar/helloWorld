<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hello World - Level 5</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;

        font-family: Inter, Arial, sans-serif;

        background: #020617;
        color: white;

        cursor: default;
      }

      canvas {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        z-index: 0;
      }

      /* -------------------------
           Mouse Light
        ------------------------- */

      .mouse-light {
        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        pointer-events: none;

        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.18),
          transparent 65%
        );

        transform: translate(-50%, -50%);

        z-index: 1;

        transition:
          left 0.1s,
          top 0.1s;
      }

      /* -------------------------
           Main Card
        ------------------------- */

      .scene {
        position: relative;

        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        perspective: 1500px;

        z-index: 2;
      }

      .level-nav {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        transform: translateX(-50%);
      }

      .level-nav a {
        padding: 8px 12px;
        border-radius: 5px;
        color: #f8fafc;
        font:
          600 14px/1 Arial,
          sans-serif;
        text-decoration: none;
        white-space: nowrap;
      }

      .level-nav a:hover,
      .level-nav a:focus-visible {
        background: #2563eb;
        outline: none;
      }

      .level-nav a[aria-current="page"] {
        background: #f8fafc;
        color: #0f172a;
      }

      .card {
        position: relative;

        width: min(780px, 90vw);
        min-height: 470px;

        padding: 70px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        border-radius: 40px;

        border: 1px solid rgba(255, 255, 255, 0.18);

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.03)
        );

        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);

        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.6),
          inset 0 1px rgba(255, 255, 255, 0.25);

        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg))
          translateZ(0);

        transition: transform 0.12s ease-out;
      }

      /* Moving border */

      .card::before {
        content: "";

        position: absolute;
        inset: -1px;

        border-radius: inherit;

        padding: 1px;

        background: linear-gradient(
          120deg,
          transparent,
          #38bdf8,
          #a855f7,
          #ec4899,
          transparent
        );

        background-size: 300% 300%;

        animation: borderMove 5s linear infinite;

        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);

        -webkit-mask-composite: xor;

        mask-composite: exclude;

        pointer-events: none;
      }

      /* -------------------------
           Badge
        ------------------------- */

      .badge {
        position: relative;

        padding: 9px 18px;

        margin-bottom: 30px;

        border-radius: 999px;

        background: rgba(255, 255, 255, 0.07);

        border: 1px solid rgba(255, 255, 255, 0.15);

        font-size: 12px;

        letter-spacing: 4px;

        text-transform: uppercase;

        color: #cbd5e1;

        animation: badgeFloat 3s ease-in-out infinite;
      }

      /* -------------------------
           Title
        ------------------------- */

      h1 {
        margin: 0;

        font-size: clamp(55px, 10vw, 125px);

        line-height: 0.95;

        font-weight: 900;

        letter-spacing: -5px;

        background: linear-gradient(
          90deg,
          #38bdf8,
          #818cf8,
          #c084fc,
          #f472b6,
          #fb7185,
          #38bdf8
        );

        background-size: 500% auto;

        color: transparent;

        background-clip: text;
        -webkit-background-clip: text;

        animation:
          textGradient 7s linear infinite,
          titleFloat 4s ease-in-out infinite;

        filter: drop-shadow(0 0 15px rgba(129, 140, 248, 0.4))
          drop-shadow(0 0 40px rgba(236, 72, 153, 0.2));
      }

      /* -------------------------
           Subtitle
        ------------------------- */

      .subtitle {
        margin-top: 30px;

        max-width: 500px;

        font-size: 17px;
        line-height: 1.7;

        color: rgba(255, 255, 255, 0.6);
      }

      /* -------------------------
           Magnetic Button
        ------------------------- */

      .button-wrapper {
        margin-top: 35px;

        transform: translate(var(--bx, 0px), var(--by, 0px));

        transition: transform 0.15s ease;
      }

      button {
        position: relative;

        padding: 16px 36px;

        border: 0;
        border-radius: 999px;

        color: white;

        font-size: 16px;
        font-weight: 700;

        background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);

        background-size: 200% auto;

        cursor: pointer;

        overflow: hidden;

        box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);

        animation: buttonGradient 4s linear infinite;

        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      button:hover {
        transform: scale(1.08);

        box-shadow: 0 15px 50px rgba(236, 72, 153, 0.5);
      }

      /* Shine */

      button::before {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 70%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.5),
          transparent
        );

        transform: skewX(-20deg);

        transition: left 0.6s;
      }

      button:hover::before {
        left: 130%;
      }

      /* -------------------------
           Ripple
        ------------------------- */

      .ripple {
        position: absolute;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.5);

        transform: scale(0);

        animation: ripple 0.7s linear;

        pointer-events: none;
      }

      /* -------------------------
           Corner Decorations
        ------------------------- */

      .corner {
        position: absolute;

        width: 40px;
        height: 40px;

        border-color: rgba(255, 255, 255, 0.3);
        border-style: solid;
      }

      .corner.top-left {
        top: 20px;
        left: 20px;

        border-width: 2px 0 0 2px;
      }

      .corner.top-right {
        top: 20px;
        right: 20px;

        border-width: 2px 2px 0 0;
      }

      .corner.bottom-left {
        bottom: 20px;
        left: 20px;

        border-width: 0 0 2px 2px;
      }

      .corner.bottom-right {
        bottom: 20px;
        right: 20px;

        border-width: 0 2px 2px 0;
      }

      /* -------------------------
           Animations
        ------------------------- */

      @keyframes textGradient {
        to {
          background-position: 500% center;
        }
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes badgeFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes borderMove {
        0% {
          background-position: 0% 50%;
        }

        100% {
          background-position: 300% 50%;
        }
      }

      @keyframes buttonGradient {
        0% {
          background-position: 0% center;
        }

        100% {
          background-position: 200% center;
        }
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      /* -------------------------
           Mobile
        ------------------------- */

      @media (max-width: 600px) {
        .card {
          min-height: 400px;
          padding: 40px 25px;
        }

        h1 {
          letter-spacing: -3px;
        }

        .subtitle {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="particles"></canvas>

    <div class="mouse-light"></div>

    <div class="scene">
      <main class="card">
        <span class="corner top-left"></span>
        <span class="corner top-right"></span>
        <span class="corner bottom-left"></span>
        <span class="corner bottom-right"></span>

        <div class="badge">Level 5</div>

        <h1>Hello World</h1>

        <div class="subtitle">
          A fully interactive HTML experience powered by CSS animations,
          JavaScript particles and mouse interaction.
        </div>

        <div class="button-wrapper">
          <button id="magicButton">Explore</button>
        </div>
      </main>
    </div>

    <script>
      /* =================================
           Mouse Light
        ================================= */

      const light = document.querySelector(".mouse-light");

      document.addEventListener("mousemove", (event) => {
        light.style.left = event.clientX + "px";
        light.style.top = event.clientY + "px";
      });

      /* =================================
           3D Card
        ================================= */

      const card = document.querySelector(".card");

      document.addEventListener("mousemove", (event) => {
        const x = event.clientX / window.innerWidth - 0.5;

        const y = event.clientY / window.innerHeight - 0.5;

        const rotateY = x * 18;
        const rotateX = y * -18;

        card.style.setProperty("--rx", rotateX + "deg");

        card.style.setProperty("--ry", rotateY + "deg");
      });

      /* =================================
           Magnetic Button
        ================================= */

      const wrapper = document.querySelector(".button-wrapper");

      const button = document.querySelector("#magicButton");

      button.addEventListener("mousemove", (event) => {
        const rect = button.getBoundingClientRect();

        const x = event.clientX - rect.left - rect.width / 2;

        const y = event.clientY - rect.top - rect.height / 2;

        wrapper.style.setProperty("--bx", `${x * 0.25}px`);

        wrapper.style.setProperty("--by", `${y * 0.25}px`);
      });

      button.addEventListener("mouseleave", () => {
        wrapper.style.setProperty("--bx", "0px");

        wrapper.style.setProperty("--by", "0px");
      });

      /* =================================
           Ripple Effect
        ================================= */

      button.addEventListener("click", (event) => {
        const ripple = document.createElement("span");

        ripple.classList.add("ripple");

        const rect = button.getBoundingClientRect();

        const size = Math.max(rect.width, rect.height);

        ripple.style.width = size + "px";
        ripple.style.height = size + "px";

        ripple.style.left = event.clientX - rect.left - size / 2 + "px";

        ripple.style.top = event.clientY - rect.top - size / 2 + "px";

        button.appendChild(ripple);

        setTimeout(() => {
          ripple.remove();
        }, 700);
      });

      /* =================================
           Particle System
        ================================= */

      const canvas = document.querySelector("#particles");

      const ctx = canvas.getContext("2d");

      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth * window.devicePixelRatio;

        canvas.height = window.innerHeight * window.devicePixelRatio;

        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      resizeCanvas();

      window.addEventListener("resize", resizeCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * window.innerWidth;

          this.y = Math.random() * window.innerHeight;

          this.size = Math.random() * 2 + 0.5;

          this.speedX = (Math.random() - 0.5) * 0.4;

          this.speedY = (Math.random() - 0.5) * 0.4;

          this.opacity = Math.random() * 0.6 + 0.1;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > window.innerWidth) {
            this.speedX *= -1;
          }

          if (this.y < 0 || this.y > window.innerHeight) {
            this.speedY *= -1;
          }
        }

        draw() {
          ctx.beginPath();

          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

          ctx.fillStyle = `rgba(148,163,184,${this.opacity})`;

          ctx.fill();
        }
      }

      function createParticles() {
        particles = [];

        const count = Math.min(120, Math.floor(window.innerWidth / 10));

        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
      }

      createParticles();

      window.addEventListener("resize", createParticles);

      /* =================================
           Particle Connections
        ================================= */

      function connectParticles() {
        for (let a = 0; a < particles.length; a++) {
          for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;

            const dy = particles[a].y - particles[b].y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {
              const opacity = 1 - distance / 120;

              ctx.beginPath();

              ctx.moveTo(particles[a].x, particles[a].y);

              ctx.lineTo(particles[b].x, particles[b].y);

              ctx.strokeStyle = `rgba(
                                129,
                                140,
                                248,
                                ${opacity * 0.15}
                            )`;

              ctx.stroke();
            }
          }
        }
      }

      /* =================================
           Animation Loop
        ================================= */

      function animate() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        particles.forEach((particle) => {
          particle.update();
          particle.draw();
        });

        connectParticles();

        requestAnimationFrame(animate);
      }

      animate();
    </script>
    <nav class="level-nav" aria-label="Level navigation">
      <a href="./Level1.html">Level1</a>
      <a href="./Level2.html">Level2</a>
      <a href="./Level3.html">Level3</a>
      <a href="./Level4.html">Level4</a>
      <a href="./Level5.html" aria-current="page">Level5</a>
    </nav>
  </body>
</html>
