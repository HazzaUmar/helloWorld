<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World - Level 3</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;

        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background: radial-gradient(
          circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
          #3b82f6,
          #111827 25%,
          #030712 70%
        );

        transition: background 0.15s ease;
      }

      .container {
        position: relative;

        padding: 70px 100px;

        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 30px;

        background: rgba(255, 255, 255, 0.08);

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px rgba(255, 255, 255, 0.15);

        backdrop-filter: blur(15px);

        transform: perspective(800px) rotateX(var(--rotate-x, 0deg))
          rotateY(var(--rotate-y, 0deg));

        transition: transform 0.15s ease;
      }

      h1 {
        margin: 0;

        font-size: clamp(50px, 8vw, 100px);
        font-weight: 800;
        letter-spacing: 3px;

        background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6, #60a5fa);

        background-size: 300% auto;

        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;

        text-shadow:
          0 0 10px rgba(96, 165, 250, 0.4),
          0 0 30px rgba(167, 139, 250, 0.3);

        animation:
          gradientMove 4s linear infinite,
          floating 3s ease-in-out infinite;
      }

      /* نور متحرک پشت متن */

      .glow {
        position: absolute;

        width: 180px;
        height: 180px;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: #6366f1;

        border-radius: 50%;

        filter: blur(80px);

        opacity: 0.35;

        z-index: -1;

        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% center;
        }

        100% {
          background-position: 300% center;
        }
      }

      @keyframes floating {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.25;
        }

        50% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.45;
        }
      }

      .level-nav {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        transform: translateX(-50%);
      }

      .level-nav a {
        padding: 8px 12px;
        border-radius: 5px;
        color: #f8fafc;
        font:
          600 14px/1 Arial,
          sans-serif;
        text-decoration: none;
        white-space: nowrap;
      }

      .level-nav a:hover,
      .level-nav a:focus-visible {
        background: #2563eb;
        outline: none;
      }

      .level-nav a[aria-current="page"] {
        background: #f8fafc;
        color: #0f172a;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="glow"></div>
      <h1>Hello World</h1>
    </div>

    <script>
      document.addEventListener("mousemove", (event) => {
        const x = event.clientX;
        const y = event.clientY;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        const rotateY = (x - centerX) / 30;
        const rotateX = -(y - centerY) / 30;

        document.documentElement.style.setProperty("--mouse-x", `${x}px`);

        document.documentElement.style.setProperty("--mouse-y", `${y}px`);

        document.documentElement.style.setProperty(
          "--rotate-x",
          `${rotateX}deg`,
        );

        document.documentElement.style.setProperty(
          "--rotate-y",
          `${rotateY}deg`,
        );
      });
    </script>
    <nav class="level-nav" aria-label="Level navigation">
      <a href="./Level1.html">Level1</a>
      <a href="./Level2.html">Level2</a>
      <a href="./Level3.html" aria-current="page">Level3</a>
      <a href="./Level4.html">Level4</a>
      <a href="./Level5.html">Level5</a>
    </nav>
  </body>
</html>
